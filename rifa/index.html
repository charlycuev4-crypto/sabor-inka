<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos y Ganancias</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 450px; margin: 0 auto; }
        .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
        h2, h3 { margin-top: 0; color: #1c1e21; text-align: center; }
        .total-box { background: #107c41; color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .total-box p { margin: 5px 0 0; font-size: 32px; font-weight: bold; }
        label { font-size: 13px; font-weight: bold; color: #606770; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 16px; }
        button { width: 100%; padding: 14px; background-color: #0084ff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #e4e6eb; font-size: 15px; }
        .ganancia { color: #107c41; font-weight: bold; }
        .gasto { color: #d93025; font-weight: bold; }
        .btn-delete { background: none; border: none; color: #8d949e; font-size: 14px; margin-left: 10px; cursor: pointer; width: auto; padding: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="total-box">
        <h3>Saldo Total del Día</h3>
        <p id="total">$0.00</p>
    </div>

    <div class="card">
        <h3>Nuevo Registro</h3>
        <label>Producto o Concepto</label>
        <input type="text" id="nombre" placeholder="Ej: Bebida, Pan, Pago de luz">

        <label>Monto ($)</label>
        <input type="number" id="monto" placeholder="0.00" step="0.01">

        <label>Tipo de movimiento</label>
        <select id="tipo">
            <option value="ganancia">🟢 Ganancia (+)</option>
            <option value="gasto">🔴 Gasto (-)</option>
        </select>

        <button onclick="agregarRegistro()">Guardar Movimiento</button>
    </div>

    <div class="card">
        <h3>Movimientos Registrados</h3>
        <ul id="lista"></ul>
        <button onclick="borrarTodo()" style="background-color: #dc3545; margin-top: 20px;">Reiniciar Día</button>
    </div>
</div>

<script>
    let registros = JSON.parse(localStorage.getItem('mis_registros')) || [];

    function actualizarInterfaz() {
        const lista = document.getElementById('lista');
        const totalElem = document.getElementById('total');
        lista.innerHTML = '';
        let total = 0;

        registros.forEach((item, index) => {
            const li = document.createElement('li');
            if (item.tipo === 'ganancia') {
                total += item.monto;
                li.innerHTML = `<span>${item.nombre}</span> <div><span class="ganancia">+ $${item.monto.toFixed(2)}</span> <button class="btn-delete" onclick="eliminarItem(${index})">❌</button></div>`;
            } else {
                total -= item.monto;
                li.innerHTML = `<span>${item.nombre}</span> <div><span class="gasto">- $${item.monto.toFixed(2)}</span> <button class="btn-delete" onclick="eliminarItem(${index})">❌</button></div>`;
            }
            lista.appendChild(li);
        });

        totalElem.textContent = `$${total.toFixed(2)}`;
        localStorage.setItem('mis_registros', JSON.stringify(registros));
    }

    function agregarRegistro() {
        const nombreInput = document.getElementById('nombre');
        const montoInput = document.getElementById('monto');
        const tipoInput = document.getElementById('tipo');

        const nombre = nombreInput.value.trim();
        const monto = parseFloat(montoInput.value);

        if (!nombre || isNaN(monto) || monto <= 0) {
            alert('Por favor ingresa un nombre y un monto válido.');
            return;
        }

        registros.push({ nombre, monto, tipo: tipoInput.value });
        actualizarInterfaz();

        nombreInput.value = '';
        montoInput.value = '';
    }

    function eliminarItem(index) {
        registros.splice(index, 1);
        actualizarInterfaz();
    }

    function borrarTodo() {
        if (confirm('¿Quieres borrar todos los datos registrados?')) {
            registros = [];
            actualizarInterfaz();
        }
    }

    // Cargar datos guardados al abrir la app
    actualizarInterfaz();
</script>

</body>
</html>
